name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        # hatch-vcs derives the version from the tag, so it needs the history
        fetch-depth: 0

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Build sdist and wheel
      run: |
        python -m pip install build
        python -m build

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      # trusted publishing needs no API token, just the OIDC id-token
      id-token: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@release/v1
